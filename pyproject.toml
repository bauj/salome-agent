[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "salome-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "langgraph",
    "requests",
    "typing-extensions>=4.16.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist"]

[project.scripts]
salome-agent = "salome_agent.cli:main"

[tool.setuptools]
packages = ["salome_agent", "salome_agent.nodes", "salome_agent.specialists",
            "salome_agent.verify", "agent_server", "executor", "executor.geom",
            "executor.shaper"]
package-data = {"salome_agent.verify" = ["toplevel_api.json"]}

[tool.pytest.ini_options]
markers = ["salome: requires a live SALOME install (skipped in CI)",
           "llm: calls a real LLM endpoint and spends tokens; deselected by default, run with -m llm"]
